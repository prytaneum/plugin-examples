name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install the hestia CLI
        run: cargo install --locked --git https://github.com/prytaneum/hestia --branch feature/plugins cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --target wasm32-wasip2 -- -D warnings
      - run: hestia plugin check
      - run: hestia plugin pack
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*.hplugin
